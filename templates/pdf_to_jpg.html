<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/card_style.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/compress.css') }}?v=2"
/>

<!-- extending base -->
{% extends 'base.html' %}

<!-- initilizing title -->
{% block main_title %} PDF to JPG {% endblock %}

<!-- implementing main container -->
{% block main_content %}
<section class="merge-page">
  <div class="merge-card">
    <h2 class="card-title-with-icon">
      <i class="card-title-icon" data-lucide="image-down"></i>
      PDF to JPG
    </h2>
    <p class="muted">Select pdf and convert into JPG.</p>

    <form
      class="merge-form ajax-upload-form"
      action="{{ url_for('pdf_to_jpg.pdf_to_jpg') }}"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <div class="drop-zone" id="dropZone" data-type="pdf">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          id="pdfInput"
          multiple
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF file here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Convert and Download</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <div class="upload-note">
      <span class="note-icon">🔎</span>
      Transform PDF documents into clear, high-resolution images in seconds.
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='scripts/card.js') }}"></script>
{% endblock %}
