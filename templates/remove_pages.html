{% extends 'base.html' %}

<!-- initilizing title -->
{% block main_title %} Remove pages {% endblock %}

<!-- implementing main container -->
{% block main_content %}
<section class="merge-page">
  <div class="merge-card">
    <h2 class="card-title-with-icon">
      <i class="card-title-icon" data-lucide="trash-2"></i>
      Remove pages
    </h2>
    <p class="muted">Select PDF file and remove pages.</p>

    <form
      class="merge-form ajax-upload-form"
      action="{{ url_for('remove_pages.remove_pages') }}"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <div class="drop-zone" id="dropZone">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          id="pdfInput"
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF files here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <div id="preview_section" class="pdf-preview"></div>

      <div class="actions">
        <button type="submit" class="btn primary">Upload & Remove Pages</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <div class="upload-note">
      <span class="note-icon">📄</span>
      Only PDF files are allowed.
    </div>
  </div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="{{ url_for('static', filename='scripts/remove_pages.js') }}"></script>
{% endblock %}
