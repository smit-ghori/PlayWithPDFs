{% extends "base.html" %} {% block main_content %}

<h1>Download section</h1>

<ul>
  {% for file in files %}

  <li>
    {{ file }}
    <a
      class="download-link"
      href="{{ url_for('download_file', folder_id=folder_id, filename=file) }}"
    >
      Download
    </a>
  </li>

  {% endfor %}
</ul>

{% endblock %}
