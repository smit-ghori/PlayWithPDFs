<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/card_style.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/compress.css') }}?v=2"
/>

<!-- extending base -->
{% extends 'base.html' %}

<!-- initilizing title -->
{% block main_title %} Compress {% endblock %}

<!-- implementing main container -->
{% block main_content %}
<section class="merge-page">
  <div class="merge-card">
    <h2>Compress</h2>
    <p class="muted">Select multiple PDF files and merge them into one.</p>

    <form
      class="merge-form ajax-upload-form"
      action="{{ url_for('compress.compress') }}"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <div class="drop-zone" id="dropZone" data-type="pdf">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          multiple
          id="pdfInput"
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF files here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <div class="compression-options">
        <label for="extream_action" class="compression-option extreme">
          <input
            type="radio"
            name="compression"
            id="extream_action"
            value="extreme"
          />
          <span class="checkmark"></span>
          Extreme Compression
        </label>
        <label for="recommended_action" class="compression-option recommended">
          <input
            type="radio"
            name="compression"
            id="recommended_action"
            value="recommended"
            checked
          />
          <span class="checkmark"></span>
          Recommended Compression
        </label>
        <label for="low_action" class="compression-option low">
          <input type="radio" name="compression" id="low_action" value="low" />
          <span class="checkmark"></span>
          Low Compression
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Upload & Compress</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <div class="upload-note">
      <span class="note-icon">📄</span>
      Only PDF files are allowed.
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='scripts/card.js') }}"></script>
{% endblock %}
