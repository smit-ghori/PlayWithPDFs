<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/card_style.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/compress.css') }}?v=2"
/>

<!-- extending base -->
{% extends 'base.html' %}

<!-- initilizing title -->
{% block main_title %} Compress {% endblock %}

<!-- implementing main container -->
{% block main_content %}
<section class="merge-page">
  <div class="merge-card compress-card">
    <h2 class="card-title-with-icon">
      <i class="card-title-icon" data-lucide="minimize-2"></i>
      Compress
    </h2>
    <p class="muted">Select multiple PDF files and merge them into one.</p>

    <form
      class="merge-form ajax-upload-form"
      action="{{ url_for('compress.compress') }}"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <div class="drop-zone" id="dropZone" data-type="pdf">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          multiple
          id="pdfInput"
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF files here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <div class="compression-options">
        <label for="extream_action" class="compression-option extreme">
          <input
            type="radio"
            name="compression"
            id="extream_action"
            value="extreme"
          />
          <span class="checkmark"></span>
          Extreme Compression
        </label>
        <label for="recommended_action" class="compression-option recommended">
          <input
            type="radio"
            name="compression"
            id="recommended_action"
            value="recommended"
            checked
          />
          <span class="checkmark"></span>
          Recommended Compression
        </label>
        <label for="low_action" class="compression-option low">
          <input type="radio" name="compression" id="low_action" value="low" />
          <span class="checkmark"></span>
          Low Compression
        </label>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Upload & Compress</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <div class="upload-note">
      <span class="note-icon">📄</span>
      Only PDF files are allowed.
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='scripts/card.js') }}"></script>
<script>
  const compressCard = document.querySelector(".compress-card");
  const compressFileInput = document.getElementById("pdfInput");
  const compressDropZone = document.getElementById("dropZone");
  const compressFileList = document.getElementById("fileList");

  function updateCompressionOptions() {
    compressCard.classList.toggle(
      "uploaded",
      compressFileList.children.length > 0
    );
  }

  function syncCompressionOptions() {
    requestAnimationFrame(updateCompressionOptions);
  }

  compressFileInput.addEventListener("change", syncCompressionOptions);
  compressDropZone.addEventListener("drop", syncCompressionOptions);

  if (typeof window.removeFile === "function") {
    const originalRemoveFile = window.removeFile;

    window.removeFile = function (...args) {
      originalRemoveFile.apply(this, args);
      syncCompressionOptions();
    };
  }

  if (typeof window.clearAll === "function") {
    const originalClearAll = window.clearAll;

    window.clearAll = function (...args) {
      originalClearAll.apply(this, args);
      syncCompressionOptions();
    };
  }

  updateCompressionOptions();
</script>
{% endblock %}
