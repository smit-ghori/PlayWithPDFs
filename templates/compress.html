<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/card_style.css') }}"
/>

<!-- extending base -->
{% extends 'base.html' %}

<!-- initilizing title -->
{% block main_title %} Compress {% endblock %}

<!-- implementing main container -->
{% block main_content %}
<section class="merge-page">
  <div class="merge-card">
    <h2>Compress</h2>
    <p class="muted">Select multiple PDF files and merge them into one.</p>

    <form
      class="merge-form"
      action="{{ url_for('compress.compress') }}"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <div class="drop-zone" id="dropZone">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          multiple
          id="pdfInput"
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF files here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Upload & Compress</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <div class="upload-note">
      <span class="note-icon">📄</span>
      Only PDF files are allowed.
    </div>
  </div>
</section>
<script src="{{ url_for('static', filename='scripts/card.js') }}"></script>
{% endblock %}
