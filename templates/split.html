<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/card_style.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/split.css') }}"
/>

<!-- extending base -->
{% extends 'base.html' %}

<!-- Main title -->
{% block main_title %} Split PDF {% endblock %}

<!-- Implementing container -->
{% block main_content %}

<section class="merge-page">
  <div class="merge-card">
    <h2>Split PDF Files</h2>
    <p class="muted">Select PDF file and split them.</p>

    <form
      class="merge-form ajax-upload-form"
      action="{{ url_for('split.split') }}"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <!-- Drop Zone -->
      <div class="drop-zone" id="dropZone">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          multiple
          id="pdfInput"
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF files here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <!-- Split Options -->
      <div class="split-options">
        <input
          type="radio"
          id="byRange"
          name="splitType"
          value="range"
          checked
        />
        <label for="byRange">Split by Pages</label>

        <input type="radio" id="bySize" name="splitType" value="size" />
        <label for="bySize">Split by Size</label>
      </div>

      <!-- Wrapper (IMPORTANT for animation) -->
      <div class="split-wrapper">
        <!-- Range Inputs -->
        <div id="rangeBox" class="split-box visible">
          <div class="input-group">
            <label>Start Page</label>
            <input
              type="number"
              name="start_page"
              placeholder="e.g. 1"
              min="1"
            />
          </div>

          <div class="input-group">
            <label>End Page</label>
            <input
              type="number"
              name="end_page"
              placeholder="e.g. 10"
              min="1"
            />
          </div>
        </div>

        <!-- Size Input -->
        <div id="sizeBox" class="split-box hidden">
          <div class="input-group">
            <label>Max Size (MB)</label>
            <input type="number" name="max_size" placeholder="e.g. 2" min="1" />
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="actions">
        <button type="submit" class="btn primary">Split & Download</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <!-- Note -->
    <div class="upload-note">
      <span class="note-icon">📄</span>
      Only PDF files are allowed.
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='scripts/split.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/cart.js') }}"></script>
{% endblock %}
