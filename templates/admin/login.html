<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · PlayWithPDFs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
  <div class="login">
    <form method="post">
      <h2>Sign in</h2>
      <p class="sub">PlayWithPDFs operations panel</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}
            <div class="flash" style="margin-bottom:14px;border-radius:2px;">{{ m }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <input type="email" name="email" placeholder="Email" required autofocus>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn primary" type="submit">Sign in</button>
      <div style="margin-top:16px;text-align:center;font-size:13.5px;">
        <a href="{{ url_for('admin.forgot_password') }}" style="text-decoration:none;">Forgot password?</a>
      </div>
    </form>
  </div>
</body>

</html>
