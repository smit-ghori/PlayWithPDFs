<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Admin{% endblock %} · PlayWithPDFs</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="shell">
  <nav class="rail">
    <h1>PlayWithPDFs<span>Operations</span></h1>
    {% set p = request.path %}
    <a href="{{ url_for('admin.dashboard') }}" class="{{ 'on' if p == '/admin/' }}">Overview</a>
    <a href="{{ url_for('admin.tools') }}" class="{{ 'on' if '/tools' in p }}">Tools</a>
    <a href="{{ url_for('admin.events') }}" class="{{ 'on' if '/events' in p }}">Activity</a>
    <a href="{{ url_for('admin.messages') }}" class="{{ 'on' if '/messages' in p }}">Messages</a>
    <a href="{{ url_for('admin.team') }}" class="{{ 'on' if '/team' in p }}">Team</a>
    <a href="{{ url_for('admin.profile') }}" class="{{ 'on' if '/profile' in p }}">Account</a>
    <div class="foot">
      {{ admin_user.email if admin_user }}<br>
      <a href="{{ url_for('admin.profile') }}">Account</a> · <a href="{{ url_for('admin.logout') }}">Sign out</a>
    </div>
  </nav>
  <main>
    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
