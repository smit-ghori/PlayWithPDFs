<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tool Unavailable · PlayWithPDFs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <style>
    body {
      background: #090f1d;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .disabled-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(239, 68, 68, 0.15);
      border-radius: 14px;
      max-width: 480px;
      width: 100%;
      padding: 36px 30px;
      text-align: center;
    }
    .icon-badge {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 26px;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #f8fafc;
      font-weight: 700;
    }
    .note-text {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 26px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .action-btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-home {
      background: #0d9488;
      color: #ffffff;
    }
    .btn-home:hover {
      background: #0f766e;
    }
  </style>
</head>
<body>
  <div class="disabled-card">
    <div class="icon-badge">🔒</div>
    <h2>{{ tool.replace('_',' ').title() }} is Restricted</h2>
    <div class="note-text">
      {{ note }}
    </div>
    <div class="actions">
      <a class="action-btn btn-home" href="/">Back to All Tools</a>
    </div>
  </div>
</body>
</html>
