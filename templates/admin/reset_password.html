<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Password · PlayWithPDFs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>
  <div class="login">
    <form method="post">
      <h2>Create New Password</h2>
      <p class="sub">Choose a strong password for your account</p>

      {% if invalid %}
      <div class="err" style="margin-bottom:16px;">{{ error }}</div>
      <div style="text-align:center;font-size:13.5px;">
        <a class="btn primary" href="{{ url_for('admin.forgot_password') }}"
          style="width:100%;box-sizing:border-box;text-align:center;">Request New Link</a>
        <div style="margin-top:14px;"><a href="{{ url_for('admin.login') }}" style="text-decoration:none;">← Back to Sign
            in</a></div>
      </div>
      {% else %}
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <input type="password" name="password" placeholder="New Password (min 6 chars)" minlength="6" required autofocus>
      <input type="password" name="confirm_password" placeholder="Confirm New Password" minlength="6" required>
      <button class="btn primary" type="submit">Set New Password</button>
      <div style="margin-top:16px;text-align:center;font-size:13.5px;">
        <a href="{{ url_for('admin.login') }}" style="text-decoration:none;">← Back to Sign in</a>
      </div>
      {% endif %}
    </form>
  </div>
</body>

</html>
