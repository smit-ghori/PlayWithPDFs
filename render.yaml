services:
  - type: web
    name: pdf-tools
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin/login

    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
