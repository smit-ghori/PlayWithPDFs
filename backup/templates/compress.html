<link rel="stylesheet" href="/static/css/merge.css" />

{% extends 'base.html' %} {% block title %} Compress {% endblock %} {% block
main_content %}
<section class="merge-page">
  <div class="merge-card">
    <h2>Compress PDF Files</h2>
    <p class="muted">Select multiple PDF files and merge them into one.</p>

    <form
      class="merge-form"
      action="/merge"
      method="POST"
      enctype="multipart/form-data"
      id="mergeForm"
    >
      <div class="drop-zone" id="dropZone">
        <input
          type="file"
          name="pdfs"
          accept="application/pdf"
          multiple
          id="pdfInput"
          hidden
        />

        <p class="drop-text">
          Drag & Drop PDF files here <br />
          <span>or click to browse</span>
        </p>

        <ul class="file-list" id="fileList"></ul>
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Upload & Compress</button>
        <button type="button" class="btn ghost" onclick="clearAll()">
          Clear All
        </button>
      </div>
    </form>

    <div class="upload-note">
      <span class="note-icon">📄</span>
      Only PDF files are allowed.
    </div>
  </div>
</section>

<script>
  const dropZone = document.getElementById("dropZone");
  const input = document.getElementById("pdfInput");
  const fileListUI = document.getElementById("fileList");

  let selectedFiles = [];

  // Open file picker when clicking drop zone
  dropZone.addEventListener("click", () => input.click());

  // Handle file selection
  input.addEventListener("change", (e) => {
    addFiles(e.target.files);
  });

  // Drag events
  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("drag-over");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("drag-over");
  });

  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    addFiles(e.dataTransfer.files);
  });

  function addFiles(files) {
    for (let file of files) {
      if (file.type === "application/pdf") {
        selectedFiles.push(file);
      }
    }
    renderFileList();
  }

  function renderFileList() {
    fileListUI.innerHTML = "";

    selectedFiles.forEach((file, index) => {
      const li = document.createElement("li");

      li.innerHTML = `
        <span class="file-name">${file.name}</span>
        <button type="button" class="remove-btn" onclick="removeFile(${index})">✕</button>
      `;

      fileListUI.appendChild(li);
    });
  }

  function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderFileList();
  }

  function clearAll() {
    selectedFiles = [];
    renderFileList();
  }

  // Before submit, rebuild input files
  document.getElementById("mergeForm").addEventListener("submit", function (e) {
    if (selectedFiles.length === 0) {
      e.preventDefault();
      alert("Please select at least one PDF file.");
      return;
    }

    const dataTransfer = new DataTransfer();
    selectedFiles.forEach((file) => dataTransfer.items.add(file));
    input.files = dataTransfer.files;
  });
</script>
{% endblock %}
